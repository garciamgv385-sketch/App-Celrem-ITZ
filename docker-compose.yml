services:
  mysql:
    image: mysql:8.4
    container_name: app_celrem_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: app_celrem
      MYSQL_USER: app_celrem
      MYSQL_PASSWORD: app_celrem_secret
    ports:
      - "3308:3306"
    volumes:
      - app_celrem_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u app_celrem -papp_celrem_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  app_celrem_mysql_data:
